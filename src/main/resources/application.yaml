spring:
  application:
    name: clickup-analytics

  # Kök dizindeki .env dosyasını otomatik olarak konfigürasyona dahil eder
  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST}
    port: ${SPRING_RABBITMQ_PORT}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

# Custom ClickUp Konfigürasyonu
clickup:
  api:
    base-url: https://api.clickup.com/api/v2
    endpoints:
      teams: "/team"
      spaces: "/team/{teamId}/space"
      folders: "/space/{spaceId}/folder"
      space_list: "/space/{spaceId}/list"
      folder_list: "/folder/{folderId}/list"
      tasks: "/list/{listId}/task"

    access-token: ${CLICKUP_API_TOKEN}
    client-id: ${CLICKUP_CLIENT_ID}
    client-secret: ${CLICKUP_CLIENT_SECRET}
    redirect-uri: ${CLICKUP_REDIRECT_URI}
  webhook:
    secret: ${CLICKUP_WEBHOOK_SECRET}
    endpoint: ${CLICKUP_WEBHOOK_ENDPOINT:}

jwt:
  # 1 yıl boyunca sabit kalacak 256-bit güvenli anahtar (HS256)
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
  # 0 = Süresiz (Token zamana bağlı değişmez, hep aynı kalır ve süresi dolmaz)
  expiration-ms: ${JWT_EXPIRATION_MS:0}

app:
  # OAuth sonrası kullanıcıların yönlendirileceği Frontend Dashboard adresi
  frontend-url: ${FRONTEND_URL:http://localhost/dashboard}
  sync:
    interval-ms: ${CLICKUP_SYNC_INTERVAL_MS:600000}
  rabbitmq:
    webhook-queue: ${WEBHOOK_QUEUE:clickup.webhook.events}
    webhook-dead-letter-queue: ${WEBHOOK_DEAD_LETTER_QUEUE:clickup.webhook.events.dlq}

server:
  # Render PORT değişkenini otomatik atar, yoksa BACKEND_PORT veya 8083 kullanılır
  port: ${PORT:${BACKEND_PORT:8083}}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    root: INFO
    org.example: DEBUG
    org.hibernate.SQL: DEBUG
